<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>AIM HotspotFinder</title>
<style>
  /* Matches the in-app AIM panel look (Control Panel): charcoal cards, cyan rgb(20,210,220). */
  :root {
    --bg: rgb(24,24,24); --bg-card: rgba(40,40,40,0.96); --bg-head: rgb(28,28,28);
    --bg-input: rgb(20,20,20);
    --border: rgba(255,255,255,0.12); --border-strong: rgba(255,255,255,0.18);
    --text: #e6e6e6; --muted: #888; --soft: #bbb;
    --cyan: rgb(20,210,220); --cyan-soft: #7adfe6; --cyan-bg: rgba(20,210,220,0.18);
    --cyan-border: rgba(20,210,220,0.5); --green: #39ff14; --red: #ff6060;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .gate {
    width: min(400px, 92vw); background: var(--bg-card);
    border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  .gate-title {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--bg-head); border-bottom: 1px solid var(--border);
  }
  .gate-title .hex { font-size: 16px; line-height: 1; color: var(--green); }
  .gate-title strong { color: var(--cyan); font-size: 14px; }
  .gate-body { padding: 14px 16px 16px; }
  .sub {
    color: var(--cyan-soft); font-size: 10px; font-weight: 600; letter-spacing: .5px;
    text-transform: uppercase; margin: 0 0 4px;
  }
  .desc { color: var(--muted); font-size: 11px; margin: 0 0 14px; line-height: 1.5; }
  label { display: block; font-size: 11px; color: var(--soft); margin: 0 0 5px; }
  input[type=password] {
    width: 100%; background: var(--bg-input); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 3px; padding: 6px 8px;
    font-size: 11px; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  input:focus { outline: none; border-color: var(--cyan-border); }
  button {
    width: 100%; margin-top: 12px; background: var(--cyan-bg); color: var(--cyan);
    border: 1px solid var(--cyan-border); border-radius: 4px; padding: 8px;
    font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; letter-spacing: .04em;
  }
  button:hover { background: rgba(20,210,220,0.3); box-shadow: 0 0 8px rgba(20,210,220,0.35); }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: var(--red); font-size: 11px; margin: 10px 0 0; min-height: 1.2em; line-height: 1.5; }
  .hint { color: var(--muted); font-size: 10.5px; margin: 14px 0 0; line-height: 1.55; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-title"><span class="hex">⬡</span><strong>AIM HotspotFinder</strong></div>
  <div class="gate-body">
    <p class="sub">CSM access only</p>
    <p class="desc">Base-station site selection — clusters, scores, and maps asset hotspots.</p>
    <label for="pat">AIM access token</label>
    <input type="password" id="pat" autocomplete="off" placeholder="ghp_… / github_pat_…">
    <button id="unlock">Unlock</button>
    <p class="err" id="err"></p>
    <p class="hint">Same token you saved in the AIM Control Panel for map outlines.
    It stays in this browser only. Ask Payden if you don't have one.</p>
  </div>
</div>
<script>
(function() {
    'use strict';
    var TAG = '[AIM HOTSPOT GATE]';
    var APP_URL = 'https://api.github.com/repos/Ned-Yap/aim-userscripts-data/contents/hotspotfinder/app.js';
    var LS_KEY = 'aim-hf-pat';
    var patInput = document.getElementById('pat');
    var btn = document.getElementById('unlock');
    var errEl = document.getElementById('err');

    function getSaved() {
        try { return localStorage.getItem(LS_KEY) || ''; } catch (e) { return ''; }
    }
    function save(pat) {
        try { localStorage.setItem(LS_KEY, pat); } catch (e) { console.warn(TAG, 'localStorage blocked'); }
    }

    function unlock(pat, silent) {
        if (!pat) { if (!silent) errEl.textContent = 'Enter your token.'; return; }
        btn.disabled = true;
        btn.textContent = 'Loading…';
        errEl.textContent = '';
        fetch(APP_URL, { headers: { 'Authorization': 'token ' + pat, 'Accept': 'application/vnd.github.raw' } })
            .then(function(res) {
                if (res.status === 401 || res.status === 403) throw new Error('Token rejected — check it and try again.');
                if (res.status === 404) throw new Error('Token accepted no access, or app missing. Ask Payden.');
                if (!res.ok) throw new Error('Load failed: HTTP ' + res.status);
                return res.text();
            })
            .then(function(code) {
                save(pat);
                window.AIM_HF_PAT = pat;
                console.log(TAG, 'app fetched (' + code.length + ' bytes), launching');
                /* run the private payload */
                (new Function(code))();
            })
            .catch(function(e) {
                console.error(TAG, e);
                btn.disabled = false;
                btn.textContent = 'Unlock';
                errEl.textContent = e.message;
            });
    }

    btn.addEventListener('click', function() { unlock(patInput.value.trim(), false); });
    patInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') unlock(patInput.value.trim(), false); });

    var saved = getSaved();
    if (saved) {
        patInput.value = saved;
        unlock(saved, true);
    }
    console.log(TAG, 'ready');
})();
</script>
</body>
</html>
